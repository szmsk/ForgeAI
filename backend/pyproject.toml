[project]
name = "forgeai"
version = "0.1.0"
description = "Autonomous AI software engineering platform with sandboxed execution and evaluation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "redis>=6,<9",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=25,<26",
  "boto3>=1.40,<2",
  "kubernetes>=33,<34",
  "prometheus-client>=0.22,<1",
  "docker>=7.1,<8",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
