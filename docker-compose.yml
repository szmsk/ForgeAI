services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: forgeai
      POSTGRES_USER: forgeai
      POSTGRES_PASSWORD: forgeai_dev_only
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U forgeai -d forgeai"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:8-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [redis:/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: forgeai
      MINIO_ROOT_PASSWORD: forgeai_dev_only
    volumes: [minio:/data]
    ports: ["9001:9001"]
  api:
    build: ./backend
    environment:
      FORGEAI_DATABASE_URL: postgresql+asyncpg://forgeai:forgeai_dev_only@postgres:5432/forgeai
      FORGEAI_REDIS_URL: redis://redis:6379/0
      FORGEAI_JWT_SECRET: ${FORGEAI_JWT_SECRET:-replace-this-secret}
      FORGEAI_ENVIRONMENT: development
      FORGEAI_CORS_ORIGINS: http://localhost:3000
      FORGEAI_S3_ENDPOINT: http://minio:9000
      FORGEAI_S3_ACCESS_KEY: forgeai
      FORGEAI_S3_SECRET_KEY: forgeai_dev_only
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
  worker:
    build: ./backend
    command: ["python","-m","app.queue.worker"]
    environment:
      FORGEAI_DATABASE_URL: postgresql+asyncpg://forgeai:forgeai_dev_only@postgres:5432/forgeai
      FORGEAI_REDIS_URL: redis://redis:6379/0
      FORGEAI_JWT_SECRET: ${FORGEAI_JWT_SECRET:-replace-this-secret}
      FORGEAI_ENVIRONMENT: development
      FORGEAI_S3_ENDPOINT: http://minio:9000
      FORGEAI_S3_ACCESS_KEY: forgeai
      FORGEAI_S3_SECRET_KEY: forgeai_dev_only
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
  frontend:
    build: ./frontend
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
volumes: {postgres: {}, redis: {}, minio: {}}
