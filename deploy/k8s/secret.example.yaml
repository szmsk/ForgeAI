apiVersion: v1
kind: Secret
metadata: {name: forgeai-config, namespace: forgeai}
type: Opaque
stringData:
  FORGEAI_ENVIRONMENT: production
  FORGEAI_DATABASE_URL: postgresql+asyncpg://USER:PASSWORD@POSTGRES_HOST:5432/forgeai
  FORGEAI_REDIS_URL: redis://REDIS_HOST:6379/0
  FORGEAI_JWT_SECRET: REPLACE_WITH_64_BYTE_RANDOM_SECRET
  FORGEAI_SANDBOX_BACKEND: kubernetes
  FORGEAI_ARTIFACT_BUCKET: forgeai-artifacts
  FORGEAI_S3_ENDPOINT: https://S3_ENDPOINT
  FORGEAI_S3_ACCESS_KEY: REPLACE
  FORGEAI_S3_SECRET_KEY: REPLACE
