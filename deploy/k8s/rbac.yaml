apiVersion: v1
kind: ServiceAccount
metadata: {name: forgeai-worker, namespace: forgeai}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: forgeai-sandbox-runner, namespace: forgeai-sandbox}
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create","get","delete","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: forgeai-worker-sandbox, namespace: forgeai-sandbox}
subjects:
- kind: ServiceAccount
  name: forgeai-worker
  namespace: forgeai
roleRef:
  kind: Role
  name: forgeai-sandbox-runner
  apiGroup: rbac.authorization.k8s.io
