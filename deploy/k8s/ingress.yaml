apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgeai
  namespace: forgeai
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  rules:
  - host: forgeai.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: forgeai-api, port: {number: 8000}}}
